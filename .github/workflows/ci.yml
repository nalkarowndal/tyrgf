name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Use the browser installed by Playwright
        if: runner.os == 'Linux'
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + require('playwright-core').chromium.executablePath() + '\n')"
      - run: npm run check
      - run: npm audit --audit-level=high
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm run test:package
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            docs/qa/
            test-results/
            playwright-report/
          retention-days: 7
