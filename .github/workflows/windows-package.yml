name: Windows package candidate
on:
  push:
    branches: ['codex/windows-validation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Diagnose Windows lock port availability
        timeout-minutes: 2
        run: node scripts/probe-data-lock.mjs
      - name: Upload lock diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-lock-diagnostics
          path: test-results/data-lock-probe.json
          retention-days: 14
      - run: npm test -- tests/backup.test.ts tests/api.test.ts tests/installer-evidence.test.ts
      - run: npm audit --audit-level=high
      - name: Prove shortcut and removal assertions reject defects
        shell: pwsh
        run: ./scripts/test-installer-layout.ps1
      - name: Bundle pinned Windows runtime
        shell: pwsh
        run: |
          $env:AURA_WINDOWS_NODE = (Get-Command node).Source
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node scripts/verify-package.mjs dist/release/win-x64
      - name: Prove recovery and timeout checks detect regressions
        run: node scripts/test-package-failures.mjs dist/release/win-x64
      - name: Test Windows PowerShell integrity preflight
        shell: powershell
        run: ./scripts/test-windows-preflight.ps1 -PackageRoot (Resolve-Path dist/release/win-x64).Path
      - name: Verify actual Windows runtime and recovery
        shell: powershell
        run: ./scripts/windows/Verify-Package.ps1 -PackageRoot (Resolve-Path dist/release/win-x64).Path -ReportPath test-results/windows-package.json
      - name: Upload runtime verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-runtime-evidence
          path: test-results/windows-package.json
          if-no-files-found: warn
          retention-days: 14
      - name: Compile installer and portable archive
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = (Resolve-Path dist/release/win-x64).Path
          $output = Join-Path (Resolve-Path dist/release).Path 'AURA-Setup.exe'
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DPACKAGE=$package" "/DOUTPUT=$output" scripts/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/release/win-x64/* -DestinationPath dist/release/AURA-Windows-x64.zip
          Get-FileHash dist/release/AURA-Setup.exe,dist/release/AURA-Windows-x64.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content dist/release/SHA256.txt -Encoding utf8
      - name: Verify visible installer, update, uninstall and reinstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Installer dist/release/AURA-Setup.exe -CheckUninstallFailure
      - name: Prove installer validation rejects data loss
        shell: pwsh
        run: |
          $source = Get-Content scripts/windows/installer.nsi -Raw -Encoding utf8
          $needle = '  DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\AURA Agent"'
          if (-not $source.Contains($needle)) { throw 'Uninstall fault injection point missing' }
          $fault = Join-Path $env:RUNNER_TEMP 'aura-fault-installer.nsi'
          $source.Replace($needle, '  RMDir /r "$LOCALAPPDATA\AURA Agent"' + "`n" + $needle) | Set-Content $fault -Encoding utf8
          $package = (Resolve-Path dist/release/win-x64).Path
          $output = Join-Path $env:RUNNER_TEMP 'AURA-Faulty-Setup.exe'
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 "/DPACKAGE=$package" "/DOUTPUT=$output" $fault
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = 'test-results/windows-installer-data-loss.json'
          & pwsh -NoProfile -File scripts/test-windows-installer.ps1 -Installer $output -ReportPath $result
          if ($LASTEXITCODE -eq 0) { throw 'Data-loss installer incorrectly passed' }
          & node scripts/assert-installer-fault.mjs $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0
      - name: Upload installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-installer-evidence
          path: test-results/windows-installer*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-unsigned-candidate
          path: |
            dist/release/AURA-Setup.exe
            dist/release/AURA-Windows-x64.zip
            dist/release/SHA256.txt
          retention-days: 14
